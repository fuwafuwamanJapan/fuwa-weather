let D=null, ERR='', WARN=null, WERR=false, advCat='cloth', pageTab='wx', lastTab='wx', topDay=0, busy=false, memo={}, autoKey='', LITE=!lsGet('noLite');
function need(){

function xhrJSON(url,ms){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();
    x.open('GET',url,true); x.responseType='json'; x.timeout=ms;
    x.onload=()=>{ if(x.status>=200&&x.status<300){ let v=x.response; if(typeof v==='string'){ try{ v=JSON.parse(v); }catch(e){ rej(e); return; } } if(v==null){ rej(new Error('empty')); return; } res(v); } else rej(new Error('HTTP '+x.status)); };
    x.onerror=()=>rej(new Error('network')); x.ontimeout=()=>rej(new Error('timeout'));
    x.send();
  });
}
async function getJSON(url,dl){
  /* MacのFirefox（スペースのiframe内）では cache:'no-store' 付きの fetch が失敗することがあるため、
     キャッシュ指定なしで取得する。締め切り（dl）までに取れなければ諦めて前回のデータを使う */
  if(navigator.onLine===false) throw new Error('offline');
  const left=()=>Math.min(10000,dl-Date.now());
  let last=null;
  if(typeof fetch==='function') for(let a=0;a<2&&left()>1500;a++){
    if(a) await new Promise(r=>setTimeout(r,1200));
    const c=new AbortController(), t=setTimeout(()=>c.abort(),left());
    try{
      const r=await fetch(url,{signal:c.signal,mode:'cors',credentials:'omit'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){ last=e; if(/^HTTP 4(?!29)/.test(e.message)) throw e; }
    finally{ clearTimeout(t); }
  }
  if(left()>1500){ try{ return await xhrJSON(url,left()); }catch(e){ last=e; } }
  throw last||new Error('timeout');
}
async function load(force){
  const names=need(), key=names.join(',');
  if(!D||D.key!==key){ const c=lsGet('D'); if(c&&c.key===key&&c.w) D=c; }
  memo={};
  if(D&&D.key===key) render();
  if(!force&&D&&D.key===key&&Date.now()-D.at<6e5&&P(S.ward)){ loadWarn(); return; }
  if(busy) return; busy=true; ERR=''; stat();
  const dl=Date.now()+30000;
  let lite=LITE;
  /* lite：1時間ごとのデータは昨日〜明日だけ取る（データ量 約1/4） */
  const om=(ns,lt)=>getJSON('https://api.open-meteo.com/v1/forecast?latitude='+ns.map(n=>WARDS[n][0])+'&longitude='+ns.map(n=>WARDS[n][1])+'&hourly='+HV+'&daily='+DV+'&current=temperature_2m,apparent_temperature,weather_code,is_day&past_days=1&forecast_days=15'+(lt?'&past_hours=26&forecast_hours=50':'')+'&timezone=Asia%2FTokyo&wind_speed_unit=ms',dl).then(j=>Array.isArray(j)?j:[j]);
  const noLite=()=>{ lite=LITE=false; lsSet('noLite',1); };
  const get=async ns=>{ try{ return await om(ns,lite); }catch(e){ if(lite&&/^HTTP 4/.test(e.message)){ noLite(); return await om(ns,false); } throw e; } };
  const enough=r=>{ const q=prep(r); return !!q&&q.now>=24&&q.b+47<q.h.time.length; };
  try{
    let used=names, arr;
    try{ arr=await get(names); }
    catch(e1){
      if(names.length<2||Date.now()>dl-3000) throw e1;
      /* 複数地点のまとめ取得が失敗する環境向け：メインの区だけでも取得する */
      used=[S.ward]; arr=await get(used);
    }
    if(lite&&!arr.every(enough)){ noLite(); arr=await om(used,false); }
    const w={}; used.forEach((n,i)=>w[n]=arr[i]);
    if(used!==names&&D&&D.w) for(const n in D.w) if(!w[n]) w[n]=D.w[n];
    D={key,at:Date.now(),w}; lsSet('D',D);
  }catch(e){ ERR=(navigator.onLine===false?'オフラインです':'通信できませんでした')+(D?'（前回のデータを表示中）':''); }
  busy=false; render(); loadWarn();
}
async function loadWarn(force){

function prep(r){
  if(!r||!r.hourly||!r.daily) return null;
  const n=new Date(Date.now()+r.utc_offset_seconds*1e3), today=n.toISOString().slice(0,10);
  const b=r.hourly.time.indexOf(today+'T00:00'), dI=r.daily.time.indexOf(today);
  if(b<0||dI<0) return null;
  return {r,h:r.hourly,d:r.daily,b,dI,n,now:b+n.getUTCHours(),min:n.getUTCHours()*60+n.getUTCMinutes(),dow:n.getUTCDay()};
}

function hr(p,i){
  const g=k=>{const v=p.h[k]&&p.h[k][i]; return v==null?0:+v;};
  return {i,t:g('temperature_2m'),at:g('apparent_temperature'),pop:g('precipitation_probability'),mm:g('precipitation'),code:g('weather_code'),ws:g('wind_speed_10m'),wg:g('wind_gusts_10m'),rh:g('relative_humidity_2m'),pr:g('pressure_msl'),uv:g('uv_index'),day:g('is_day')};
}
const lbl=(p,i)=>(i-p.b>=24?'明日':'')+((i-p.b)%24)+'時';
function rainPhrase(p){
  const segs=[], end=p.now+24; let s=-1;
  for(let i=p.now;i<=end;i++){ const w=i<end&&isWet(hr(p,i)); if(w&&s<0) s=i; if(!w&&s>=0){ segs.push([s,i]); s=-1; } }
  if(!segs.length) return 'この先24時間、雨の心配はほとんどありません';
  const [a,z]=segs[0], word=isSnow(hr(p,a).code)?'雪':'雨';
  let t=a===p.now?'今は'+word+'の予報。'+(z>=end?'しばらく続く見込みです':lbl(p,z)+'頃に止む見込み')
                 :lbl(p,a)+'頃から'+word+(z>=end?'の見込み':'、'+lbl(p,z)+'頃に止む見込み');
  if(segs.length>1) t+='（'+lbl(p,segs[1][0])+'頃にも）';
  return t;
}
function bestDry(p,k){
  const a=k?p.b+30:Math.max(p.now,p.b+6), z=p.b+24*k+18; let best=null, s=-1;
  for(let i=a;i<=z;i++){ const h=hr(p,i), ok=i<z&&h.pop<30&&h.mm===0&&h.rh<85; if(ok&&s<0) s=i; if(!ok&&s>=0){ if(!best||i-s>best[1]-best[0]) best=[s,i]; s=-1; } }
  return best;
}

  const L=[]; const a=k?p.b+24:p.now, z=p.b+24*(k+1);

}

    return card('',`
<div class="nowrow">${ico(code,false,'lg')}<div><div class="big" style="font-size:1.25rem;font-weight:800">${wx(code)}</div><div>最高 <b class="hi">${R(d.temperature_2m_max[i])}°C</b>　最低 <b class="lo">${R(d.temperature_2m_min[i])}°C</b></div>
<div class="sub">最高気温は${diffTxt(R(d.temperature_2m_max[i]-d.temperature_2m_max[i-1]),k?'今日':'昨日')}</div></div></div><div class="hours">${hs.join('')}</div>`);
  },
  advice(p){
    const k=topDay, d=p.d, i=p.dI+k, day=k?'明日':'今日', items=[], lv=(v,a,b)=>Math.max(a,Math.min(5,Math.round(v))), noon=hr(p,p.b+24*k+13);
    items.push({k:'cloth',t:'服装',fig:illCloth(noon.at),j:clothShort(noon.at),d:day+'の日中（13時）の体感は'+R(noon.at)+'°C。'+cloth(noon.at)+'が目安です。',n:'体感'+R(noon.at)+'°',lv:5-clothStage(noon.at)});
    const rest=dayHours(p,k), maxPop=rest.length?Math.max(...rest.map(h=>h.pop)):0, maxMm=rest.length?Math.max(...rest.map(h=>h.mm)):0;
    const uj=maxPop>=50||maxMm>=1?'傘は必須':maxPop>=30||maxMm>0?'折りたたみ傘':'傘はいらない';
    items.push({k:'umb',t:'傘',fig:illUmb(uj),j:uj,d:uj==='傘は必須'?'降水確率が高めです。出かける前に雨雲も確認を。':uj==='折りたたみ傘'?'にわか雨の可能性があります。折りたたみがあると安心です。':'傘なしで大丈夫そうな一日です。',n:R(maxPop)+'%',lv:lv(maxPop/20,0)});
    items.push(Object.assign({k:'laundry',t:'洗濯'},dryInfo(p,k)));
    const uv=d.uv_index_max[i]||0;
    items.push({k:'uv',t:'紫外線',fig:illUV(uv),j:uv>=8?'非常に強い':uv>=6?'強い':uv>=3?'中程度':'弱い',d:uv>=8?'日傘・日焼け止めをしっかりと。':uv>=6?'日焼け止めをおすすめします。':uv>=3?'長時間の外出時は日焼け止めを。':'紫外線は弱めです。',n:'UV '+r1(uv),lv:lv(uv/2,0)});
    const rng=d.temperature_2m_max[i]-d.temperature_2m_min[i], df=R(d.temperature_2m_max[i]-d.temperature_2m_max[i-1]);
    if(rng>=10) items.push({k:'diff',t:'寒暖差',fig:illThermo(lv(rng/4,1)),j:'寒暖差が大きい',d:'一日の気温差が'+R(rng)+'°C。脱ぎ着しやすい服で調整を。',n:R(rng)+'°C差',lv:lv(rng/4,1)});
    else if(Math.abs(df)>=5) items.push({k:'diff',t:'気温の変化',fig:illThermo(lv(Math.abs(df)/3,1)),j:df>0?'ぐっと暖かい':'ぐっと寒い',d:'最高気温が'+diffTxt(df,k?'今日':'昨日')+'。服装に注意してください。',n:(df>0?'+':'')+df+'°C',lv:lv(Math.abs(df)/3,1)});
    if(rest.length){
      const wm=rest.reduce((a,h)=>h.wg>a.wg?h:a,rest[0]);
      if(wm.wg>=10) items.push({k:'wind',t:'風',fig:illWind(lv(wm.wg/3,1)),j:wm.wg>=15?'強い風に注意':'やや風が強い',d:lbl(p,wm.i)+'頃に最大'+R(wm.wg*3.6)+'km/hの風。'+(wm.wg>=15?'傘が壊れやすく、自転車は注意。':'洗濯物はしっかり留めて。'),n:'最大'+R(wm.wg*3.6)+'km/h',lv:lv(wm.wg/3,1)});
      const rmin=Math.min(...rest.map(h=>h.rh)), dry=!k&&WARN&&WARN.list.some(x=>x[1]==='乾燥注意報');
      if(dry||rmin<=35) items.push({k:'dry',t:'乾燥',fig:illDry(lv((60-rmin)/10,1)),j:'乾燥に注意',d:(dry?'乾燥注意報が出ています。':'空気が乾燥し、湿度'+R(rmin)+'%まで下がる見込み。')+'のど・肌の保湿を。',n:'湿度'+R(rmin)+'%',lv:lv((60-rmin)/10,1)});
    }
    const sel=items.some(x=>x.k===advCat)?advCat:'cloth', dots=n=>{ let s=''; for(let q=0;q<5;q++) s+='<span class="dot'+(q<n?' on':'')+'"></span>'; return s; };
    return `<section class="advwrap"><h2>お役立ち情報</h2><div class="cattabs">${items.map(x=>`<button type="button" data-a="acat" data-v="${x.k}" class="${x.k===sel?'on':''}">${x.t}</button>`).join('')}</div>`
      +items.filter(x=>x.k===sel).map(x=>`<div class="advcard"><div class="advart${x.k==='cloth'?' tall':''}">${x.fig}</div><div class="advmain"><div class="advtop"><span class="advttl">${x.t}</span><span class="advjudge">${x.j}</span><span class="advrhs"><span class="dots">${dots(x.lv)}</span><span class="advnum">${x.n}</span></span></div><div class="advdesc">${x.d}</div></div></div>`).join('')
      +(sel==='cloth'?'<div class="cloth3">'+[['朝',8],['日中',13],['夜',19]].map(([nm,t])=>{ const x=hr(p,p.b+24*k+t); return `<div class="cc"><div class="ct">${nm}<b>体感${R(x.at)}°</b></div><div class="cd">${cloth(x.at)}</div></div>`; }).join('')+'</div>':'')+'</section>';
  },
  pressure(p){
    const k=topDay, base=p.b+24*k, pr=[];
    for(let i=0;i<24;i++) pr.push(hr(p,base+i).pr);
    if(pr.some(v=>!v)) return '';
    let drop3=0; for(let i=0;i+3<24;i++) drop3=Math.max(drop3,pr[i]-pr[i+3]);
    const mn=Math.min(...pr), mx=Math.max(...pr), rng=mx-mn;
    const lv=drop3>=4||rng>=7?3:drop3>=2.5||rng>=5?2:drop3>=1.5||rng>=3?1:0, LBL=['安定','やや注意','注意','警戒'];
    const diff=pr[23]-pr[0], trend=diff>=2?'上昇 ↗':diff<=-2?'下降 ↘':'安定 →';
    const seg=(a,b)=>{ const v=pr[b]-pr[a]; return v>=1?['上昇 ↗','up']:v<=-1?['下降 ↘','dn']:['安定 →','']; };
    const X=i=>(8+i*324/23).toFixed(1), Y=v=>(10+(mx-v)/(rng||1)*56).toFixed(1);
    let nowLine='';
    if(!k){ const x=X(p.n.getUTCHours()+p.n.getUTCMinutes()/60); nowLine=`<line class="gn" x1="${x}" x2="${x}" y1="4" y2="72"/><text class="gx" x="${x}" y="80" text-anchor="middle">今</text>`; }
    const desc=lv>=2?'気圧の変化が大きめです。頭痛やだるさなど、体調の変化に気をつけてください（目安）。':lv===1?'気圧はやや変化します。敏感な方は無理のない過ごし方を（目安）。':'気圧は安定しています。体調面では穏やかな一日になりそうです（目安）。';
    return card('頭痛予報',`<div class="haiku-head"><div><div class="sub">${k?'明日':'今日'}の目安</div><div class="haiku-level">${LBL[lv]}</div></div><div class="haiku-trend">気圧の傾向<b>${trend}</b></div></div><div class="gauge">${LBL.map((_,i)=>`<div class="${i===lv?'on':''}"></div>`).join('')}</div><div class="gaugelbl">${LBL.map((t,i)=>`<span class="${i===lv?'on':''}">${t}</span>`).join('')}</div><div class="hchips">${[['朝',0,9],['昼',9,18],['夜',18,23]].map(([n,a,b])=>{ const s=seg(a,b); return `<div class="hchip">${n}<b class="${s[1]}">${s[0]}</b></div>`; }).join('')}</div><svg class="gr" viewBox="0 0 340 92">${nowLine}<polyline class="gt" points="${pr.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/><text class="gx" x="8" y="90">0時</text><text class="gx" x="170" y="90" text-anchor="middle">12時</text><text class="gx" x="332" y="90" text-anchor="end">24時</text></svg><div class="sub">最低 ${R(mn)} hPa ・ 最高 ${R(mx)} hPa ・ 気圧の推移（hPa）</div><div class="advdesc" style="margin-top:8px">${desc}</div>`);
  },
  compare(){
    return card('2地点の比較','<div class="cmp">'+S.cmp.map(n=>{
      const q=P(n); if(!q) return `<div class="c"><div class="cn">${n}</div><div class="sub">データなし</div></div>`;
      const d=q.d, i=q.dI, c=d.weather_code[i];
      return `<div class="c"><div class="cn">${n}　${R(hr(q,q.now).t)}°C</div><div class="nowrow">${ico(c,false,'md')}<div><div>${wx(c)}</div><div><span class="lo">${R(d.temperature_2m_min[i])}°C</span> / <span class="hi">${R(d.temperature_2m_max[i])}°C</span></div></div></div><div class="sub">${rainPhrase(q)}</div></div>`;
    }).join('')+'</div>');
  },
  weekly(p){
    const d=p.d, L=[];
    for(let i=p.dI;i<p.dI+14&&i<d.time.length;i++){
      const [y,m,dd]=d.time[i].split('-').map(Number), w=new Date(Date.UTC(y,m-1,dd)).getUTCDay(), c=d.weather_code[i];
      L.push(`<div class="wk"><span class="wkdate">${i===p.dI?'今日':i===p.dI+1?'明日':m+'/'+dd} ${dowBadge(w,true)}</span>${ico(c,false,'sm')}<span>${wx(c)}</span><span class="pp">☂${d.precipitation_probability_max[i]??0}%</span><span><span class="hi">${R(d.temperature_2m_max[i])}</span>/<span class="lo">${R(d.temperature_2m_min[i])}°C</span></span></div>`);
    }
    return card('14日間の天気',L.join(''));
  },
  radar(){
    const [la,lo]=WARDS[S.ward];
    return card('',`<div class="links"><a class="lb" href="https://www.jma.go.jp/bosai/nowc/#lat:${la}/lon:${lo}/zoom:11/colordepth:normal/elements:hrpns&amp;slmcs" target="_blank" rel="noopener">🌧 雨雲の動き（気象庁）</a><a class="lb" href="${JMA_W}" target="_blank" rel="noopener">⚠ 警報・注意報（気象庁）</a></div>`);
  }
};

/* ---------- 表示 ---------- */
const hm=t=>{const d=new Date(t); return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');};
const stat=()=>{$('st').textContent=busy?'更新中…':ERR||(D?'更新 '+hm(D.at):'');};
function render(){
  memo={}; stat(); syncNav();
  const p=P(S.ward), nd=p?null:new Date();
  $('place').textContent='名古屋市'+S.ward;
  $('dateline').innerHTML=p?(p.n.getUTCMonth()+1)+'月'+p.n.getUTCDate()+'日 '+dowBadge(p.dow,false):(nd.getMonth()+1)+'月'+nd.getDate()+'日 '+dowBadge(nd.getDay(),false);
  if(!p){ main.innerHTML=card('','<div class="msg">'+(busy?'読み込み中…':ERR||'読み込み中…')+'</div>'); return; }
  /* 表示中のタブだけ作る。時間ごとの天気の横スクロール位置は保つ */
  const hs=main.querySelector('.hscroll'), sx=hs?hs.scrollLeft:0;
  main.innerHTML=S.order.filter(id=>PANES[pageTab].includes(id)&&!S.off.includes(id)).map(id=>{ try{ return F[id](p); }catch(e){ return ''; } }).join('')
    ||card('','<div class="sub">このタブに表示する項目がありません。右上の「設定」から選べます。</div>');
  const hs2=main.querySelector('.hscroll'); if(hs2&&sx) hs2.scrollLeft=sx;
}
function syncNav(){
  document.querySelectorAll('#dayseg [data-ds]').forEach(b=>b.classList.toggle('on',b.dataset.ds==='week'?pageTab==='week':pageTab!=='week'&&+b.dataset.ds===topDay));
  document.querySelectorAll('#tabbar [data-pt]').forEach(b=>b.classList.toggle('on',b.dataset.pt===pageTab));
}
const go=()=>{ render(); window.scrollTo(0,0); };
/* 夜（NIGHT時以降）に開いたら最初から「明日」を表示。手で切り替えた後は、日付か昼夜が変わるまで維持 */
function autoDay(){ const n=new Date(Date.now()+324e5), h=n.getUTCHours(), key=n.toISOString().slice(0,10)+(h>=NIGHT); if(key!==autoKey){ autoKey=key; topDay=h>=NIGHT?1:0; } }
main.addEventListener('click',e=>{ const b=e.target.closest('[data-a="acat"]'); if(b){ advCat=b.dataset.v; render(); } });
$('tabbar').addEventListener('click',e=>{ const b=e.target.closest('[data-pt]'); if(b){ pageTab=lastTab=b.dataset.pt; go(); } });
$('dayseg').addEventListener('click',e=>{ const b=e.target.closest('[data-ds]'); if(!b) return; if(b.dataset.ds==='week') pageTab='week'; else { topDay=+b.dataset.ds; pageTab=lastTab; } go(); });
$('refBtn').onclick=()=>{ load(true); loadWarn(true); };
$('setBtn').onclick=openSet;
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ autoDay(); render(); load(false); } });

/* ---------- 設定画面 ---------- */
let SD='base', keyAtOpen='';
const curList=()=>SD==='base'?S.base:S.dows[SD];
const wardOpts=(sel,main)=>(main?'<option value="">メイン</option>':'')+WN.map(w=>`<option${w===sel?' selected':''}>${w}</option>`).join('');
function openSet(){ keyAtOpen=need().join(','); SD='base'; drawSet(); sheet.hidden=false; sheet.scrollTop=0; document.body.classList.add('lock'); }
function closeSet(){ sheet.hidden=true; document.body.classList.remove('lock'); saveS(); if(need().join(',')!==keyAtOpen) load(true); else render(); loadWarn(); }
function drawSet(){
  const isB=SD==='base', list=curList();
  let h=`<div class="shd"><h2>設定</h2><span class="sp"></span><button type="button" data-a="close" class="pri">完了</button></div>
<h3>地点</h3><label>メインの区</label><select data-k="ward">${wardOpts(S.ward)}</select>
<label>2地点の比較に使う区</label><div class="two"><select data-k="cmp" data-i="0">${wardOpts(S.cmp[0])}</select><select data-k="cmp" data-i="1">${wardOpts(S.cmp[1])}</select></div>
<h3>予定の時間</h3><div class="sub">曜日ごとに別の予定にもできます。区を選ぶと、その時間だけ別の区の天気になります。</div>
<div class="dtabs"><button type="button" data-a="sd" data-d="base" class="${isB?'on':''}">基本</button>${[...DOW].map((c,i)=>`<button type="button" data-a="sd" data-d="${i}" class="${SD===i?'on':''}${S.dows[i]?' cu':''}">${c}</button>`).join('')}</div>`;
  if(!isB) h+=`<label class="chk"><input type="checkbox" data-k="dowOn"${list?' checked':''}> ${DOW[SD]}曜日は別の予定にする</label>`;
  h+=list?list.map((x,i)=>`<div class="srow"><input data-k="sn" data-i="${i}" value="${esc(x.n)}" placeholder="名前" maxlength="12"><input type="time" data-k="st" data-i="${i}" value="${x.t}"><select data-k="sw" data-i="${i}">${wardOpts(x.w,true)}</select><button type="button" data-a="sdel" data-i="${i}" aria-label="削除">✕</button></div>`).join('')+'<button type="button" data-a="sadd">＋ 時間を追加</button>'
         :'<div class="sub">今は「基本」の予定を使っています。</div>';
  h+='<h3>表示する項目と順番</h3>'+PG.map(([g,nm])=>{ const ids=S.order.filter(id=>PANES[g].includes(id)); return '<label>'+nm+'</label>'+ids.map((id,i)=>`<div class="orow"><label class="chk"><input type="checkbox" data-k="on" data-id="${id}"${S.off.includes(id)?'':' checked'}> ${SECT[id]}</label><button type="button" data-a="mv" data-id="${id}" data-d="-1"${i?'':' disabled'}>↑</button><button type="button" data-a="mv" data-id="${id}" data-d="1"${i<ids.length-1?'':' disabled'}>↓</button></div>`).join(''); }).join('');
  h+=`<h3>見た目</h3><label>文字の大きさ</label><select data-k="fs">${['標準','大','特大'].map((t,i)=>`<option value="${i}"${S.fs===i?' selected':''}>${t}</option>`).join('')}</select>
<label>画面の色</label><select data-k="theme">${[['auto','自動（スマホの設定に合わせる）'],['light','明るい'],['dark','暗い']].map(([v,t])=>`<option value="${v}"${S.theme===v?' selected':''}>${t}</option>`).join('')}</select>
<h3>設定の保存</h3><div class="sub">別の端末（iPadなど）に同じ設定を移せます。</div>
<div class="btns"><button type="button" data-a="exp">設定をコピー</button><button type="button" data-a="imp">設定を貼り付け</button><button type="button" data-a="reset">初期設定に戻す</button></div>
<div class="sub ver">fuwa weather ver ${VER}<br>天気：Open-Meteo／警報：気象庁</div>`;
  sheetIn.innerHTML=h;
}
sheet.addEventListener('input',e=>{ const t=e.target; if(t.dataset.k==='sn'){ curList()[+t.dataset.i].n=t.value.slice(0,12); saveS(); } });
sheet.addEventListener('change',e=>{
  const t=e.target, k=t.dataset.k, i=+t.dataset.i; if(!k||k==='sn') return;
  if(k==='ward') S.ward=t.value;
  else if(k==='cmp') S.cmp[i]=t.value;
  else if(k==='st'){ if(t.value) curList()[i].t=t.value; }
  else if(k==='sw') curList()[i].w=t.value;
  else if(k==='dowOn'){ if(t.checked) S.dows[SD]=clone(S.base); else delete S.dows[SD]; drawSet(); }
  else if(k==='on'){ S.off=S.off.filter(x=>x!==t.dataset.id); if(!t.checked) S.off.push(t.dataset.id); }
  else if(k==='fs'){ S.fs=+t.value; applyLook(); }
  else if(k==='theme'){ S.theme=t.value; applyLook(); }
  saveS();
});
sheet.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!b.dataset.a) return;
  const a=b.dataset.a, i=+b.dataset.i;
  if(a==='close') return closeSet();
  if(a==='exp') return expS();
  if(a==='imp') return impS();
  if(a==='sd') SD=b.dataset.d==='base'?'base':+b.dataset.d;
  else if(a==='sadd') curList().push({n:'予定',t:'12:00',w:''});
  else if(a==='sdel') curList().splice(i,1);
  else if(a==='mv'){ const id=b.dataset.id, g=Object.keys(PANES).find(k=>PANES[k].includes(id)), ids=S.order.filter(x=>PANES[g].includes(x)), o=ids[ids.indexOf(id)+(+b.dataset.d)]; if(o){ const x=S.order.indexOf(id), y=S.order.indexOf(o); [S.order[x],S.order[y]]=[S.order[y],S.order[x]]; } }
  else if(a==='reset'){ return dlgOpen('初期設定に戻しますか？','今の設定がすべて初期状態に戻ります。','',[{l:'キャンセル'},{l:'初期設定に戻す',pri:1,fn:()=>{ S=fix(null); SD='base'; applyLook(); saveS(); drawSet(); }}]); }
  saveS(); drawSet();
});
/* アプリ内ダイアログ（ブラウザ標準ダイアログの代わり） */
function dlgOpen(title,msg,ta,btns){
  $('dlgT').textContent=title; $('dlgM').textContent=msg||'';
  const t=$('dlgTa'); if(ta===null||ta===undefined){ t.hidden=true; } else { t.hidden=false; t.value=ta; t.readOnly=false; }
  const bb=$('dlgBtns'); bb.innerHTML='';
  btns.forEach(b=>{
    const btn=document.createElement('button'); btn.type='button'; btn.textContent=b.l; if(b.pri) btn.className='pri';
    btn.onclick=()=>{ if(b.keep!==true) $('dlg').hidden=true; if(b.fn) b.fn(); };
    bb.appendChild(btn);
  });
  $('dlg').hidden=false;
}
function dlgMsg(title,msg){ dlgOpen(title,msg,null,[{l:'閉じる',pri:1}]); }
function expS(){
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  dlgOpen('設定をコピー','下の文字が設定コードです。「コピーする」を押すか、文字をすべて選んでコピーしてください。もう一方の端末で「設定を貼り付け」を押してください。',code,[{l:'コピーする',pri:1,keep:true,fn:()=>{ const t=$('dlgTa'); t.focus(); t.select(); if(navigator.clipboard) navigator.clipboard.writeText(t.value); else document.execCommand('copy'); $('dlgM').textContent='コピーしました。'; }},{l:'閉じる'}]);
  $('dlgTa').readOnly=true;
}
function impS(){
  dlgOpen('設定を貼り付け','コピーした設定コードを下に貼り付けて、「読み込む」を押してください。','',[{l:'キャンセル'},{l:'読み込む',pri:1,fn:()=>{
    const c=$('dlgTa').value; if(!c||!c.trim()) return;
    try{ S=fix(JSON.parse(decodeURIComponent(escape(atob(c.trim()))))); saveS(); applyLook(); SD='base'; drawSet(); dlgMsg('読み込みました','設定を読み込みました。'); }
    catch(e){ dlgMsg('読み込めませんでした','コピーした文字をそのまま貼り付けてください。'); }
  }}]);
}

applyLook(); autoDay(); load(false);
</script>
